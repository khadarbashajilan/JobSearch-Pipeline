[build-system]
requires = [ "poetry-core",]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "jobsearch-pipeline"
version = "2.0.0"
description = "Résumé-driven job discovery, matching, and tracking, built on a vendored copy of JobSpy"
# The vendored jobspy/ package is by Cullen Watson, Zachary Hampton and
# contributors (MIT): https://github.com/cullenwatson/JobSpy
authors = ["JobSearch-Pipeline contributors"]
readme = "README.md"
keywords = [ "jobs-scraper", "linkedin", "indeed", "resume-matching"]
[[tool.poetry.packages]]
include = "jobspy"
[[tool.poetry.packages]]
include = "jobsearch"

[tool.poetry.scripts]
jobsearch = "jobsearch.cli:main"

[tool.black]
line-length = 88

[tool.poetry.dependencies]
python = "^3.11"  # tomllib
requests = "^2.31.0"
beautifulsoup4 = "^4.12.2"
pandas = "^2.1.0"
numpy = ">=1.26.0"
pydantic = "^2.3.0"
tls-client = "^1.0.1"
markdownify = "^1.1.0"
regex = "^2024.4.28"

[tool.poetry.group.dev.dependencies]
jupyter = "^1.0.0"
black = "*"
pre-commit = "*"
pytest = "*"
pytest-mock = "*"
responses = "*"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
